{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Account | IIEH iPortal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 500px;">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <i class="bi bi-exclamation-triangle-fill text-danger"
                       style="font-size: 3rem;"></i>

                    <h2 class="mt-3">Delete Account</h2>

                    <p class="text-muted">
                        This action permanently deletes your account and may
                        delete related profile data. It cannot be undone.
                    </p>
                </div>

                {% if error %}
                    <div class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST"
                      action="{% url 'users_nusrat:delete_account' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Confirm Your Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your current password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="form-check mb-4">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="confirm_delete"
                            name="confirm_delete"
                            value="yes"
                            required
                        >

                        <label class="form-check-label" for="confirm_delete">
                            I understand that my account will be permanently deleted.
                        </label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i>
                            Permanently Delete Account
                        </button>

                        <a href="{% url 'users_nusrat:profile' %}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i>
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</body>
</html>
