<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Staff Profile</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>


body {

    background:
    linear-gradient(
        135deg,
        #e8f5e9,
        #ffffff
    );

    min-height:100vh;

}


.profile-card {

    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);

}


.profile-header {

    background:#0077b6;
    color:white;
    padding:25px;
    border-radius:20px 20px 0 0;

}


.info-box {

    background:#f8f9fa;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;

}


.logout-btn {

    border-radius:12px;

}


</style>


</head>



<body>



<div class="container mt-5">


<div class="row justify-content-center">


<div class="col-md-6">


<div class="card profile-card">


<div class="profile-header text-center">


<h2>👩‍⚕️ Staff Profile</h2>


<p class="mb-0">Eye Hospital OPD/IPD Operations</p>


</div>


<div class="card-body p-4">


<div class="info-box">

<strong>Username:</strong>

{{ profile.user.username }}

</div>


<div class="info-box">

<strong>Email:</strong>

{{ profile.user.email }}

</div>


<div class="info-box">

<strong>Assigned Counter:</strong>

{{ profile.assigned_counter }}

</div>


<div class="info-box">

<strong>Shift:</strong>

{{ profile.get_shift_display }}

</div>


<div class="info-box">

<strong>Desk Extension:</strong>

{{ profile.desk_extension }}

</div>


<a href="{% url 'users_nusrat:logout' %}" class="btn btn-danger w-100 logout-btn">Logout</a>


</div>


</div>


</div>


</div>


</div>


</body>

</html>
