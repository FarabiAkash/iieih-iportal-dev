<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Eye Hospital Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: linear-gradient(
                135deg,
                #e3f2fd,
                #f8f9fa
            );
            min-height: 100vh;
            display: flex;
            align-items: center;
        }


        .login-card {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: none;
        }


        .hospital-logo {
            font-size: 45px;
        }


        .btn-login {

            background-color: #0077b6;
            color: white;
            border-radius: 10px;

        }


        .btn-login:hover {

            background-color: #005f8f;
            color: white;

        }


        .form-control {

            border-radius: 10px;

        }


    </style>

</head>


<body>


<div class="container">


<div class="row justify-content-center">


<div class="col-md-5">


<div class="card login-card p-4">


<div class="text-center">


<div class="hospital-logo">👁️</div>


<h2 class="mt-2">Eye Hospital Portal</h2>


<p class="text-muted">OPD & IPD Management System</p>

</div>


{% if error %}

<div class="alert alert-danger">
{{error}}
</div>

{% endif %}


<form method="POST">

{% csrf_token %}

<div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
</div>

<div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
</div>

<button class="btn btn-login w-100 py-2">Login</button>

</form>

<div class="text-center mt-4">
    <small class="text-muted">Providing better vision care management</small>
</div>

</div>

</div>

</div>

</div>

</body>

</html>
