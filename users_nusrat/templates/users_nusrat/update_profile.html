{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile | IIEIH iPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }
        body { min-height:100vh; margin:0; padding:24px 14px; display:flex; align-items:center; justify-content:center; font-family:Arial,Helvetica,sans-serif; background:radial-gradient(circle at top right,rgba(37,99,235,.12),transparent 35%),linear-gradient(135deg,#eef8f7,#f8fbff); }
        .form-card { width:100%; max-width:680px; border-radius:22px; overflow:hidden; background:#fff; box-shadow:0 20px 50px rgba(15,23,42,.12); }
        .form-header { padding:28px 32px; color:#fff; background:linear-gradient(135deg,#0f766e,#2563eb); }
        .form-header h1 { margin:0 0 8px; font-size:27px; font-weight:700; }
        .form-header p { margin:0; opacity:.9; font-size:14px; }
        .form-body { padding:30px 32px 32px; }
        .form-label { font-size:13px; font-weight:700; color:#334155; margin-bottom:7px; }
        .form-control,.form-select { padding:11px 13px; border-radius:10px; border-color:#cbd5e1; }
        .form-control:focus,.form-select:focus { border-color:#0f766e; box-shadow:0 0 0 .2rem rgba(15,118,110,.13); }
        .help-text { display:block; margin-top:6px; font-size:12px; color:#64748b; }
        .action-row { display:flex; gap:12px; margin-top:24px; }
        .save-btn,.cancel-btn { flex:1; display:flex; justify-content:center; align-items:center; gap:8px; border:0; border-radius:10px; padding:12px; font-size:14px; font-weight:700; text-decoration:none; }
        .save-btn { background:#0f766e; color:#fff; }
        .save-btn:hover { background:#115e59; color:#fff; }
        .cancel-btn { background:#f1f5f9; color:#334155; }
        .cancel-btn:hover { background:#e2e8f0; color:#0f172a; }
        @media(max-width:520px) { .form-header {padding:24px 22px;} .form-body {padding:24px 22px;} .form-header h1 {font-size:23px;} .action-row {flex-direction:column;} }
    </style>
</head>
<body>
    <main class="form-card">
        <header class="form-header">
            <h1><i class="bi bi-person-gear"></i> Update Profile</h1>
            <p>Manage your staff contact and desk information.</p>
        </header>
        <section class="form-body">
            {% if error %}<div class="alert alert-danger" role="alert"><i class="bi bi-exclamation-circle-fill"></i> {{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" value="{{ request.user.username }}" readonly>
                    <small class="help-text">Your username cannot be changed here.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-control" type="email" id="email" name="email" value="{{ request.user.email }}" maxlength="254" required>
                </div>
        
                <div class="mb-3">
                    <label class="form-label" for="assigned_counter">
                        Assigned Counter
                    </label>

                    <select
                        id="assigned_counter"
                        name="assigned_counter"
                        class="form-select"
                        required>
                        <option value="">Select your assigned counter</option>

                        {% for counter in counter_choices %}
                            <option
                                value="{{ counter }}"
                                {% if form_data %}
                                {% if form_data.assigned_counter == counter %}
                                    selected
                                {% endif %}
                                {% elif profile.assigned_counter == counter %}
                                    selected
                                {% endif %}>
                                {{ counter }}
                            </option>
                        {% endfor %}
                    </select>

                    <small class="help-text">
                        Select the counter assigned to you.
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="shift">Shift</label>
                    <select class="form-select" id="shift" name="shift" required>
                        {% for value, label in shift_choices %}
                            <option value="{{ value }}" {% if profile.shift == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="desk_extension">Desk Extension</label>
                    <input class="form-control" type="text" id="desk_extension" name="desk_extension" placeholder="e.g. 102" value="{{ profile.desk_extension }}" maxlength="20" required>
                    <small class="help-text"> Enter the desk extension assigned to your desk.</small>
                </div>
                <div class="action-row">
                    <button class="save-btn" type="submit"><i class="bi bi-check-circle-fill"></i> Save Changes</button>
                    <a class="cancel-btn" href="{% url 'users_nusrat:profile' %}"><i class="bi bi-x-circle"></i> Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
