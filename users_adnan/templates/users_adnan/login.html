<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIEH — Pharmacy Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0077b6, #023e8a);
            min-height: 100vh;
        }
        .login-card {
            border-radius: 20px;
            border: none;
        }
        .btn-login {
            background-color: #0077b6;
            border: none;
        }
        .btn-login:hover {
            background-color: #023e8a;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="card login-card shadow-lg p-4" style="width: 420px;">
        <div class="text-center mb-4">
            <i class="bi bi-eye-fill fs-1 text-primary"></i>
            <h4 class="fw-bold mt-2">IIEH iPortal</h4>
            <p class="text-muted small">Eye Pharmacy & Consumables Management</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            IIEH — Institute of Integrated Eye Health
        </p>
    </div>
</body>
</html>
