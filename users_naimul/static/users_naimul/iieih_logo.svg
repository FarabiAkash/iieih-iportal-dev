<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Ispahani Islamia Eye Institute & Hospital Official Stylized Eye Logo -->
  <g fill="none" stroke-linecap="round">
    <!-- Top Eyelid Arcs (Red, Orange, Yellow) -->
    <!-- 1. Top Red Arc -->
    <path d="M 20 18 C 38 7, 72 8, 106 50" stroke="#EB4335" stroke-width="7.5" />
    
    <!-- 2. Middle Orange Arc -->
    <path d="M 21 28 C 38 18, 70 19, 103 60" stroke="#F59E0B" stroke-width="7.5" />
    
    <!-- 3. Inner Yellow Arc -->
    <path d="M 23 38 C 39 30, 68 30, 99 70" stroke="#FBBF24" stroke-width="7.5" />

    <!-- Bottom Eyelid Arcs (Light Green, Medium Green, Sky Blue) -->
    <!-- 4. Inner Light Green Arc -->
    <path d="M 23 44 C 30 75, 62 90, 99 76" stroke="#9AD144" stroke-width="7.5" />
    
    <!-- 5. Middle Green Arc -->
    <path d="M 19 54 C 28 85, 62 99, 94 85" stroke="#34A853" stroke-width="7.5" />
    
    <!-- 6. Outer Blue Arc -->
    <path d="M 14 65 C 24 96, 56 108, 85 96" stroke="#0284C7" stroke-width="7.5" />
  </g>
</svg>
